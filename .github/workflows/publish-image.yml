name: Publish image

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Validate release secrets
        env:
          DEPLOYMENT_REPOSITORY: ${{ secrets.CINEKO_DEPLOYMENT_REPOSITORY }}
          DEPLOYMENT_TOKEN: ${{ secrets.CINEKO_DEPLOYMENT_TOKEN }}
          CENTRAL_URL: ${{ secrets.CINEKO_CENTRAL_URL }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.CINEKO_RELEASE_PUBLISH_TOKEN }}
          IMAGE: ${{ secrets.CINEKO_IMAGE }}
          REGISTRY: ${{ secrets.CINEKO_REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.CINEKO_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CINEKO_REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in \
            "$DEPLOYMENT_REPOSITORY" \
            "$DEPLOYMENT_TOKEN" \
            "$CENTRAL_URL" \
            "$RELEASE_PUBLISH_TOKEN" \
            "$IMAGE" \
            "$REGISTRY" \
            "$REGISTRY_USERNAME" \
            "$REGISTRY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "required Repository Secret is missing" >&2
              exit 1
            fi
          done

      - name: Authenticate to the image registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.CINEKO_REGISTRY }}
          username: ${{ secrets.CINEKO_REGISTRY_USERNAME }}
          password: ${{ secrets.CINEKO_REGISTRY_PASSWORD }}

      - name: Resolve immutable image tag
        id: image
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release source SHA is invalid" >&2
            exit 1
          fi
          echo "tag=sha-${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Resolve the bundled browser runtime
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a semantic version" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v${version}" ]]; then
            echo "release tag ${RELEASE_TAG} does not match VERSION ${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          browser_revision="$(sed -nE 's/^ARG CINEKO_BROWSER_REVISION=([0-9]+)$/\1/p' Dockerfile)"
          if [[ ! "$browser_revision" =~ ^[0-9]+$ ]]; then
            echo "Dockerfile must declare one numeric browser revision" >&2
            exit 1
          fi
          echo "browser_revision=$browser_revision" >> "$GITHUB_OUTPUT"
          published_at="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.published_at')"
          if [[ -z "$published_at" || "$published_at" == "null" ]]; then
            echo "published release metadata is unavailable" >&2
            exit 1
          fi
          echo "published_at=$published_at" >> "$GITHUB_OUTPUT"
          echo "playwright_version=$(bash scripts/playwright-version.sh driver)" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CINEKO_VERSION=${{ steps.runtime.outputs.version }}
            PLAYWRIGHT_VERSION=${{ steps.runtime.outputs.playwright_version }}
          tags: ${{ secrets.CINEKO_IMAGE }}:${{ steps.image.outputs.tag }}

      - name: Register the immutable Probe release
        env:
          BROWSER_REVISION: ${{ steps.runtime.outputs.browser_revision }}
          CENTRAL_URL: ${{ secrets.CINEKO_CENTRAL_URL }}
          IMAGE: ${{ secrets.CINEKO_IMAGE }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PROBE_VERSION: ${{ steps.runtime.outputs.version }}
          PUBLISHED_AT: ${{ steps.runtime.outputs.published_at }}
          CINEKO_RELEASE_PUBLISH_TOKEN: ${{ secrets.CINEKO_RELEASE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          go run ./cmd/releasecontract publish \
            "$CENTRAL_URL" \
            "$PROBE_VERSION" \
            "$BROWSER_REVISION" \
            "$IMAGE" \
            "$IMAGE_DIGEST" \
            "$PUBLISHED_AT"

      - name: Request immutable deployment
        env:
          TARGET: cineko-probe
          DEPLOYMENT_REPOSITORY: ${{ secrets.CINEKO_DEPLOYMENT_REPOSITORY }}
          GH_TOKEN: ${{ secrets.CINEKO_DEPLOYMENT_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${DEPLOYMENT_REPOSITORY}/dispatches" \
            -f event_type=image-published \
            -f "client_payload[target]=$TARGET" \
            -f "client_payload[digest]=$IMAGE_DIGEST" \
            -f "client_payload[tag]=$IMAGE_TAG" \
            -f "client_payload[version]=${{ inputs.release_tag }}" \
            -f "client_payload[source_repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[source_sha]=$SOURCE_SHA"
